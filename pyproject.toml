[tool.poetry]
name = "health-tracker"
version = "0.1.0"
description = "Personal AI health tracker."
package-mode = false

[tool.poetry.dependencies]
python = "^3.13.4"
streamlit = "^1.50"
pandas = "^2.3"
openai = "^1"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ipykernel = ">=6.0"

[[tool.poetry.source]]
name = "default"
priority = "primary"
url = "https://pypi.org/simple"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"